custom_rules:
  - policy_id: 9001
    name: WordPress admin probe
    pattern: (?i)wp-(admin|login|content)
    option:
      header: true
      body: false
      uri: true
    score: 5
  - policy_id: 9002
    name: Log4Shell JNDI lookup
    pattern: '\$\{jndi:(ldap|rmi|dns|iiop|corba|nds|nis):'
    option:
      header: true
      body: true
      uri: true
    score: 5
  - policy_id: 9003
    name: Scanner user agents
    pattern: (?i)(sqlmap|nikto|acunetix|nessus|masscan|nmap|wpscan)
    option:
      header: true
      body: false
      uri: true
    score: 5
  - policy_id: 9004
    name: BlockContains Dwiyan
    pattern: Dwiyan
    option:
      header: true
      body: true
      uri: true
    score: 5
