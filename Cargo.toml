[package]
name = "novaflow"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.96"
clap = { version = "4.5.23", features = ["derive"] }
constant_time_eq = "0.3"
futures = "0.3.31"
http-body-util = "0.1.2"
hyper = { version = "1.5.1", features = ["full"] }
hyper-util = { version = "0.1.10", features = ["full"] }

moka = { version = "0.12.10", features = ["future"] }
multer = "3"
redis = { version = "0.29.2", features = ["tokio-comp", "connection-manager"] }
maxminddb = { version = "0.25.0", features = ["mmap"] }
async-trait = "0.1.88"

regex = "1.11.1"
rustls = { version = "0.23", default-features = false, features = ["ring","aws_lc_rs"] }
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "charset", "http2"] }
rustls-pemfile = "2.2.0"
flate2 = "1.0"
tar = "0.4"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
syslog = "7"
serde_yaml = "0.9.34"
tokio = { version = "1.41.1", features = ["full"] }
tokio-rustls = "0.26.2"
opentelemetry = "0.33.0"
opentelemetry_sdk = { version = "0.33.0", features = ["trace", "metrics", "rt-tokio", "experimental_metrics_periodicreader_with_async_runtime", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.33.0", features = ["trace", "metrics", "http-proto", "reqwest-client"] }
tracing = { version = "0.1.41", features = ["valuable"] }
tracing-opentelemetry = "0.34.0"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["json", "valuable"] }
valuable = { version = "0.1", features = ["derive"] }
url = "2.5.4"
urlencoding = "2.1"
uuid = { version = "1.11.0", features = ["v7"] }
