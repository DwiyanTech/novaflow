listen_address: 0.0.0.0
listen_port: 9001
ssl:
  enabled: true
  ca_path: ./example/sample.pem
  key_path: ./example/sample.rsa
logging:
  mode: stdout
  trace_traffic: true
  file_path: /tmp/
  file_name: novaflow.log
virtual_server:
  enabled: true
  config:
    - name: Backend1
      path: /backend2
      remote_address: http://127.0.0.1:3000
domain_server:
  enabled: true
  config:
    - name: domain_1
      domain_name: testserver.com
      remote_address: http://1.1.1.1
# Split configuration files. When set, NovaFlow loads the geoip and
# rate_limit sections from these files instead of inline values.
geoip_config_path: geoip.yaml
rate_limit_config_path: ratelimit.yaml
admin_api_token: ''
error_pages:
  forbidden_html: |+


    <!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2.0//EN">
    <html><head>
    <title>403 Forbidden</title>
    </head><body>
    <h1>Forbidden</h1>
    <p>Your request was blocked by the Novaflow WAF. Contact your administrator if you believe this is a false positive. RequestID : REPLACE_WITH_UUID_REQUESTS</p>
    <hr>
    <address>Powered by <a href="https://github.com/DwiyanTech/novaflow">Novaflow</a></address>
    </body></html>

  not_found_html: |+


    <!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2.0//EN">
    <html><head>
    <title>404 Not Found</title>
    </head><body>
    <h1>Not Found</h1>
    <p>The requested URL was not found on this server.</p>
    <hr>
    <address>Powered by <a href="https://github.com/DwiyanTech/novaflow">Novaflow</a></address>
    </body></html>

  bad_gateway_html: |+

    <!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2.0//EN">
    <html><head>
    <title>502 Bad Gateway</title>
    </head><body>
    <h1>Bad Gateway</h1>
    <p>The WAF received an invalid response from the upstream server. RequestID : REPLACE_WITH_UUID_REQUESTS</p>
    <hr>
    <address>Powered by <a href="https://github.com/DwiyanTech/novaflow">Novaflow</a></address>
    </body></html>

# OpenTelemetry (optional). When enabled, novaflow exports OTLP/HTTP traces
# and metrics (request count/duration, WAF inspection time, upstream latency).
# Changing this section requires a restart.
# otel:
#   enabled: false
#   endpoint: "http://localhost:4318"
#   service_name: "novaflow"
#   sample_ratio: 1.0

admin_api:
  enabled: true
  listen_address: 127.0.0.1
  listen_port: 9000
